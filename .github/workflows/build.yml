name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Persian font (Vazirmatn)
        run: |
          mkdir -p app/src/main/assets/fonts
          for w in Regular Bold; do
            curl -fsSL -o app/src/main/assets/fonts/Vazirmatn-$w.ttf \
              https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-$w.ttf \
              || rm -f app/src/main/assets/fonts/Vazirmatn-$w.ttf
          done
          ls -la app/src/main/assets/fonts || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SecondBrain-APK
          path: app/build/outputs/apk/debug/*.apk
